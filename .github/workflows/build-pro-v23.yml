name: Build SignalLogger Pro v2.3.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SignalLogger_Pro_Source_v2.3.1.zip'
      - '.github/workflows/build-pro-v231.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q SignalLogger_Pro_Source_v2.3.1.zip -d buildsrc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalLogger-Pro-v2.3.1-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
