name: Build SignalLogger Pro v2.4.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q SignalLogger_Pro_v2.4.0_GitHub_COMPLETE.zip -d build-src

          echo "=== Extracted files ==="
          find build-src -maxdepth 3 -type f | sort

      - name: Find Gradle project and build APK
        run: |
          SETTINGS=$(find build-src -type f -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project: $PROJECT_DIR"

          cd "$
