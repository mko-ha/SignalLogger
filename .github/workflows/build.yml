name: Build SignalLogger Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SignalLogger_Pro_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Pro project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q SignalLogger_Pro_Source.zip -d buildsrc

      - name: Verify Pro applicationId
        run: |
          grep -F 'applicationId = "com.example.signallogger.pro"' buildsrc/app/build.gradle.kts
          if grep -F 'applicationId = "com.example.signallogger"' buildsrc/app/build.gradle.kts; then
            echo "ERROR: Old applicationId detected"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Pro debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload SignalLogger Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalLogger-Pro-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
